input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # [SVC]/[CTRL] 로그에서 응답시간 숫자 추출
  if [message] =~ "완료 \|" {
    grok {
      match => { "message" => "완료 \| %{NUMBER:duration_ms}ms" }
    }
    mutate {
      convert => { "duration_ms" => "integer" }
    }
  }

  # 불필요한 내부 필드 제거 (LogstashEncoder가 @timestamp를 이미 올바르게 전송)
  mutate {
    remove_field => ["host", "port"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "pocat-logs-%{+YYYY.MM.dd}"
  }

  # 디버그용 — 콘솔 출력 (학습 시 Logstash 동작 확인)
  stdout {
    codec => rubydebug
  }
}
