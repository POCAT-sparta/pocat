input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # 타임스탬프 파싱
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # 불필요한 내부 필드 제거
  mutate {
    remove_field => ["host", "port"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "pocat-logs-%{+YYYY.MM.dd}"
  }

  # 디버그용 — 콘솔 출력 (학습 시 Logstash 동작 확인)
  stdout {
    codec => rubydebug
  }
}
