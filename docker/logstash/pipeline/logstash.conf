input {
  tcp {
    port => 5000
    codec => json_lines {
      charset => "UTF-8"
    }
  }
}

filter {
  # [SVC]/[CTRL] 로그에서 응답시간 숫자 추출
  if [message] =~ "완료 \|" {
    grok {
      match => { "message" => "완료 \| %{NUMBER:duration_ms}ms" }
    }
    mutate {
      convert => { "duration_ms" => "integer" }
    }
  }

  # analytics 이벤트: result_count 숫자 변환
  if [result_count] {
    mutate {
      convert => { "result_count" => "integer" }
    }
  }

  # analytics 이벤트: bid_price 숫자 변환
  if [bid_price] {
    mutate {
      convert => { "bid_price" => "integer" }
    }
  }

  # analytics 이벤트: final_price 숫자 변환
  if [final_price] {
    mutate {
      convert => { "final_price" => "integer" }
    }
  }

  mutate {
    remove_field => ["host", "port"]
  }
}

output {
  # ── 전체 앱 로그 ────────────────────────────────────────────────
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "pocat-logs-%{+YYYY.MM.dd}"
  }

  # ── 카드/입찰/거래 analytics 이벤트만 전용 인덱스에 추가 저장 ───
  # event_type: card_view | card_search | auction_bid | card_trade
  if [event_type] in ["card_view", "card_search", "auction_bid", "card_trade"] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "card-analytics-%{+YYYY.MM.dd}"
    }
  }

  # 디버그용 — 콘솔 출력 (필요 시 주석 처리)
  stdout {
    codec => rubydebug
  }
}
