spring:
  flyway:
    enabled: false
  elasticsearch:
    uris: http://localhost:9200
  ai:
    openai:
      api-key: "test-key-disabled"
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-1.5-flash
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    read:
      url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      driver-class-name: org.h2.Driver
      username: sa
      password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      cluster:
        nodes: localhost:6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        max.block.ms: 500        # Kafka 미기동 시 send() 블록킹 최대 500ms로 제한
        request.timeout.ms: 500  # 요청 타임아웃도 짧게 설정
    admin:
      fail-fast: false           # 토픽 생성 실패 시 컨텍스트 기동 중단 방지
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
  cloud:
    aws:
      parameterstore:
        enabled: false

jwt:
  secret: pocatjwttestsecretkeypocatjwttestsecretkeypocatjwttestsecretkeypocatjwttestsecretkeypocatjwttestsecretkey
  access-token-expiration: 3600000
  refresh-token-expiration: 86400000

view:
  ip-secret: test-ip-secret-key

portone:
  secret: test-portone-secret
  webhook-secret: test-webhook-secret

pocat:
  internal:
    token: test-internal-token

cloud:
  aws:
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket
