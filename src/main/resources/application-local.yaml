spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pocat}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 10     # k6 BP 테스트 병목 포인트 — 기본값 명시 (변경 후 재실행 시 BP 이동 확인 가능)
      minimum-idle: 10
      connection-timeout: 30000  # 30초
      idle-timeout: 600000       # 10분
      max-lifetime: 1800000      # 30분

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:redis-1:7001,redis-2:7002,redis-3:7003,redis-4:7004,redis-5:7005,redis-6:7006}
        max-redirects: 3

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9095}

  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}

  ai:
    openai:
      api-key: ${GEMINI_API_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

view:
  ip-secret: ${VIEW_IP_SECRET:local-view-secret}

jwt:
  secret: ${JWT_SECRET:local-jwt-secret-key-for-development-only}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:86400000}

loki:
  url: ${LOKI_URL:http://localhost:3100}

# == AWS S3 ==
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET}

portone:
  secret: ${PORTONE_SECRET:local-portone-secret}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:local-portone-webhook-secret}
  webhook-allowed-ips: ${PORTONE_WEBHOOK_ALLOWED_IPS:}

pocat:
  internal:
    token: ${POCAT_INTERNAL_TOKEN:local-internal-token}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true