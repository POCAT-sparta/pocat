spring:
  config:
    import: aws-parameterstore:/pocat/prod/

  cloud:
    aws:
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    read:
      # #206: Parameter Store에 DB_READ_URL=jdbc:mysql://pocat-slave.czykgqcswy2z.ap-northeast-2.rds.amazonaws.com:3306/pocat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8 설정 완료
      url: ${DB_READ_URL:${DB_URL}}
      username: ${DB_READ_USERNAME:${DB_USERNAME}}
      password: ${DB_READ_PASSWORD:${DB_PASSWORD}}
      driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
      hikari:
        # #206: db.t4g.micro replica(max_connections≈85) 기준. write는 기존 정책상 hikari 미설정(기본 10/10) 유지.
        # 부하테스트(03/05)에서 read 풀=5 고갈로 p95 폭발 확인 → 일시 상향(20×3대=60, replica 한도 내 여유 ~25).
        #   ⚠️ replica CPU 동시 관찰 필수: pending↓·p95↓면 성공, replica CPU 100%면 새 병목=replica 등급(스케일업 필요).
        maximum-pool-size: 20
        minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      password: ${REDIS_PASSWORD}
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
        max-redirects: 3

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  elasticsearch:
    uris: ${ES_URI}

  ai:
    openai:
      api-key: ${GEMINI_API_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

view:
  ip-secret: ${VIEW_IP_SECRET}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:86400000}

loki:
  url: ${LOKI_URL}

logstash:
  host: ${LOGSTASH_HOST:10.0.137.237}
  port: ${LOGSTASH_PORT:5000}

# == AWS S3 ==
cloud:
  aws:
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET}
    cloudfront:
      domain: ${AWS_CLOUDFRONT_DOMAIN}

portone:
  secret: ${PORTONE_SECRET}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}
  webhook-allowed-ips: ${PORTONE_WEBHOOK_ALLOWED_IPS:}

pocat:
  internal:
    token: ${POCAT_INTERNAL_TOKEN}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
