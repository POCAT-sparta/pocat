spring:
  application:
    name: POCAT
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
  ai:
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-1.5-flash
          temperature: 0.3
          max-tokens: 1024
      embedding:
        options:
          model: text-embedding-004
    vectorstore:
      elasticsearch:
        index-name: pocat-ai-index
        dimensions: 768
        similarity: cosine
        initialize-schema: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

view:
  ip-secret: ${VIEW_IP_SECRET}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:86400000}

# == AWS S3 ==
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET}

# == 포트원 ==
portone:
  secret: ${PORTONE_SECRET}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}
  webhook-allowed-ips: ${PORTONE_WEBHOOK_ALLOWED_IPS:}

pocat:
  internal:
    token: ${POCAT_INTERNAL_TOKEN}
  monitoring:
    auction-anomaly-threshold: 3.0

outbox:
  relay:
    age-threshold-seconds: 10

ranking:
  auction:
    like-weight: 1.0
    bid-weight: 3.0
    ttl-seconds: 70
    cache-size: 100
    max-response-size: 50

loki:
  url: ${LOKI_URL:http://loki:3100}

management:
  health:
    elasticsearch:
      # spring-boot-actuator 3.5.x 가 elasticsearch-java 8.17+ API(activeShardsPercentAsNumber)를 호출하는데
      # spring-ai 1.0.0 과의 호환 버전(8.16.x)에는 해당 메서드가 없어 헬스체크가 NoSuchMethodError로 터짐.
      # ES 연결 자체는 정상 동작하므로 액추에이터 헬스 지표만 비활성화.
      enabled: false

rate-limit:
  signup-limit: 5
  signup-window-seconds: 60
  reissue-limit: 5
  reissue-window-seconds: 60
  post-limit: 5
  post-window-seconds: 60
  comment-limit: 5
  comment-window-seconds: 60
  search-limit: 30
  search-window-seconds: 60
  like-limit: 10
  like-window-seconds: 60
  login-limit: 10
  login-window-seconds: 60
  auction-limit: 10
  auction-window-seconds: 60
  bid-limit: 30
  bid-window-seconds: 60
  chat-limit: 20
  chat-window-seconds: 60
  order-limit: 10
  order-window-seconds: 60
  payment-limit: 10
  payment-window-seconds: 60
  refund-limit: 5
  refund-window-seconds: 60
  card-limit: 10
  card-window-seconds: 60
  user-limit: 10
  user-window-seconds: 60
  ai-limit: 10
  ai-window-seconds: 60

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  ratelimiter:
    instances:
      aiEndpoint:
        limitForPeriod: 10
        limitRefreshPeriod: 60s
        timeoutDuration: 0s

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
