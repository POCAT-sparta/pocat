spring:
  application:
    name: POCAT
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-1.5-flash
          temperature: 0.3
          max-tokens: 1024
      embedding:
        options:
          model: text-embedding-004
    vectorstore:
      elasticsearch:
        index-name: pocat-ai-index
        dimensions: 768
        similarity: cosine
        initialize-schema: true

view:
  ip-secret: ${VIEW_IP_SECRET}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:86400000}

# == 포트원 ==
portone:
  secret: ${PORTONE_SECRET}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}

ranking:
  auction:
    like-weight: 1.0
    bid-weight: 3.0
    ttl-seconds: 70
    cache-size: 100
    max-response-size: 50

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  ratelimiter:
    instances:
      aiEndpoint:
        limitForPeriod: 10
        limitRefreshPeriod: 60s
        timeoutDuration: 0s
