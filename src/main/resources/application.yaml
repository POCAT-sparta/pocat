spring:
  application:
    name: POCAT

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-2.5-flash
          temperature: 0.3
          max-tokens: 1024
          # gemini-2.5-flash thinking 비활성화 (추론 토큰 0).
          # thinking이 max-tokens 예산을 소진해 JSON 응답이 잘리는 문제 방지.
          reasoning-effort: none
      embedding:
        options:
          model: gemini-embedding-001
          dimensions: 768
    vectorstore:
      elasticsearch:
        index-name: pocat-ai-index
        dimensions: 768
        similarity: cosine
        initialize-schema: true

pocat:
  internal:
    token: ${POCAT_INTERNAL_TOKEN}
  monitoring:
    auction-anomaly-threshold: 3.0

outbox:
  relay:
    age-threshold-seconds: 10

ranking:
  auction:
    like-weight: 1.0
    bid-weight: 3.0
    ttl-seconds: 70
    cache-size: 100
    max-response-size: 50


logstash:
  host: ${LOGSTASH_HOST:logstash}
  port: ${LOGSTASH_PORT:5000}

management:
  health:
    elasticsearch:
      enabled: false
    kafka:
      enabled: false
  endpoint:
    health:
      show-details: when_authorized

rate-limit:
  signup-limit: 5
  signup-window-seconds: 60
  reissue-limit: 5
  reissue-window-seconds: 60
  post-limit: 5
  post-window-seconds: 60
  comment-limit: 5
  comment-window-seconds: 60
  search-limit: 30
  search-window-seconds: 60
  like-limit: 10
  like-window-seconds: 60
  login-limit: 10
  login-window-seconds: 60
  auction-limit: 10
  auction-window-seconds: 60
  bid-limit: 30
  bid-window-seconds: 60
  chat-limit: 20
  chat-window-seconds: 60
  order-limit: 10
  order-window-seconds: 60
  payment-limit: 10
  payment-window-seconds: 60
  refund-limit: 5
  refund-window-seconds: 60
  card-limit: 10
  card-window-seconds: 60
  user-limit: 10
  user-window-seconds: 60
  ai-limit: 10
  ai-window-seconds: 60
  ai-embedding-limit: 80
  ai-embedding-window-seconds: 60

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  ratelimiter:
    instances:
      aiEndpoint:
        limitForPeriod: 10
        limitRefreshPeriod: 60s
        timeoutDuration: 0s