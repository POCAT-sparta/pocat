spring:
  application:
    name: POCAT
  datasource:
    url: jdbc:mysql://localhost:3306/pocat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 8080

jwt:
  secret: cG9jYXQtc2VjcmV0LWtleS1mb3ItaG1hYy1zaGEyNTYtZW5jb2Rpbmctc3RyaW5n
  access-token-expiration: 1800000    # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)
